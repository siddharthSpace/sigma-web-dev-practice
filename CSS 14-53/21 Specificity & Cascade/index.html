<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Specificity</title>

    <style>
        /* The specificity of this is one  */
        h1 {
            color: aqua;
        }


         /* The specificity of this selector is 1+10 = 11 */
        h1.yellow {
            color: yellow;
        }

        /* The specificity of this selector is 10  */
        .cred {
            color: red;
        }

         /* The specificity of this selector is 10 */
        .cpurpal {
            color: purple;
        }
       
         /* The specificity of this selector is 1+10+10+10+10 = 41  */
        a.sidclass.rohan-class[href]:hover{
            color: blueviolet;
        }


        /* This is an example of attribute selector . 
        The specificity of this selector is 10  */

    </style>

</head>

<body>
    <div>
        <h1 class="yellow cred cpurpal">
            CSS Specificity
        </h1>
    </div>
</body>

</html>

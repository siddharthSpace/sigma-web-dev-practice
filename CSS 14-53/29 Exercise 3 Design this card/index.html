<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>

 * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
.layout {
    background-color: rgb(54, 43, 34);
    border-radius: 25px;
    color: antiquewhite;
    width: 320px;
    margin: 50px auto;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    font-family: "Poppins", sans-serif;
}



.img {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 15px;
    display: block;
}

.text span {
    background-color: #f2f4f7;
    color: #555;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 50px;
    margin-right: 8px;
    display: inline-block;
}

.para h1 {
    color: white;
    font-size: 20px;
    margin-top: 15px;
    margin-bottom: 10px;
}

.para p {
    font-size: 14px;
    color: #ddd;
    line-height: 1.5;
}

        

        

       
    </style>
</head>

<body>

    <div class="layout">
        <img class="img" src="mountain img.jpg">

        <div class="text">
            <span>Nature</span>
            <span>Lake</span>

        </div>

        <div class="para">
            <h1>Logo di Braies</h1>
            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Dolorum adipisci quidem quo fugiat neque
                laborum
                voluptates facere laboriosam ad expedita?</p>
        </div>
<a href="#" class="read-btn">Read More</a>
    </div>




</body>

</html>

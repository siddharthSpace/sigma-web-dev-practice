<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow and Outline</title>


    <style>
        .box {
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px grey;
        }
        .text-element{
             text-shadow: 5px 15px 5px rgb(105, 98, 98);
             outline: 2px solid black;
        }
    </style>


</head>

<body>
    <div class="box">

        I am a Box
        
    </div>

    <p class="text-element">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quam molestiae cum et voluptatem iure quisquam a
            assumenda illo dicta consequuntur!</p>
</body>

</html>

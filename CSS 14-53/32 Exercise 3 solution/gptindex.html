
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>

    <style>
        body {
            background-color: grey;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .card {
            background-color: #fff;
            width: 294px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .image {
            padding: 3px;
        }

        .image img {
            width: 100%;
            height: 200px;
            border-radius: 7px;
            object-fit: cover;
        }

        .capsules {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
        }

        .capsules span {
            background-color: #eee;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px;
            color: #333;
        }

        .content {
            padding: 0 12px 15px;
        }

        .content h1 {
            font-size: 22px;
            margin: 5px 0;
            color: #333;
        }

        .content p {
            font-size: 14px;
            color: #555;
            line-height: 1.4;
        }

        .btn-container {
            text-align: center;
            padding-bottom: 15px;
        }

        button {
            background-color: #0078ff;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #005fd1;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img src="istockphoto-1343850120-2048x2048.jpg" alt="Card Image">
        </div>

        <div class="capsules">
            <span>#Design</span>
            <span>#HTML</span>
        </div>

        <div class="content">
            <h1>Siddharth</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Corrupti expedita temporibus nesciunt quod
                eaque, obcaecati natus dolores soluta praesentium nihil similique animi illo placeat quis itaque.</p>
        </div>

        <div class="btn-container">
            <button type="submit">Submit</button>
        </div>
    </div>
</body>

</html>

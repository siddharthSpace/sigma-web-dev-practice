<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* Element selector */
        div {
            /*background-color :red; */
            background-color: red;
        }

        /* class selector  */
        .red {
            background-color: red;
        }

        /* id selector */
        #green {
            background-color: green;
        }

        /* child selector  */
        div>p {

            color: blue;
            background-color: brown;
        }


        /* desendent selector  */

     div p {
        color: blue;
        background-color: brown;

     }

/* universal selector  */
     *{
        margin: 0;
        padding: 0;
     }
   
    /* pseudo selector  */
      
    a:visited{
        color: yellow;
    }



    a:active{

        background-color: red;
    }


    a:hover{
        background-color: yellow;
    }

    p:first-child{
        background-color: aqua;
    }

    </style>



</head>

<body>
    <div class="red">
        I am a div
        <article>
            <p>
                i am a para inside div
            </p>
        </article>

    </div>

    <div id="green">
        I am another div
    </div>

    <a href="https://www.google.com">go to google</a>

</body>

</html>

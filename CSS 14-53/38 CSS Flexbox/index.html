<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flexbox</title>

    <style>

     .container{
        border: 2px solid red;
        display: flex;
        height: 80vh;
        /* justify-content: center; */
        /* align-items: center; */
        flex-wrap: wrap;
        /* align-content: center; */


        /* flex-direction: column; */

       }

       .order-3{
        order: 3;
       }

        .item1{
            /* flex-grow: 2; */
            /* flex-shrink: 1; */

            align-self: flex-start;

        }

    </style>



</head>

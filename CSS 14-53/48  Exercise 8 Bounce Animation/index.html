<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce annimation</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #282c34;
        }

        .ball {
            width: 50px;
            height: 50px;
            background-color: #61dafb;
            border-radius: 50%;
            position: relative;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% {
                top: 0;
                animation-timing-function: ease-in;
            }
            50% {
                top: 200px;
                animation-timing-function: ease-out;
            }
        }

    </style>
</head>
<body>
    


    <div class="container">


        <div class="ball">
            
        </div>
    </div>
</body>
</html>
